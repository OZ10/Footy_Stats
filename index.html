<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Footy Stats</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous">
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link href="resources/css/index.css" rel="stylesheet">
  </head>

  <body>

    <main class="container-fluid">
      <header class="row">

      </header>

      <div class="m-1">
        <div class="text-center">
          <button type="button" class="btn btn-primary m-2" onclick="setupGame()">New
            Game</button>
        </div>

        <div class="mb-2 w-100" id>
          <div class="row">
            <div class="col">Name</div>
            <div class="col">Goals</div>
            <div class="col">Assists</div>
            <div class="col">Passes</div>
            <div class="col">Saves</div>
          </div>
        </div>

        <div class="mb-2 w-100 d-none" id="playerTemplate">
          <div class="row playerRow d-flex align-items-center">
            <div class="col h-100 d-flex align-items-center" id="playerName">Name</div>
            <button class="col h-100 btn btn-primary" id="playerGoals" >0</button>
            <button class="col h-100 btn btn-primary m-1" id="playerAssists">0</button>
            <button class="col h-100 btn btn-primary" id="playerPasses">0</button>
            <button class="col h-100 btn btn-primary m-1" id="playerSaves">0</button>
          </div>
        </div>

        <div class="justify-content-center" id="playerslots">
        </div>
      </div>

      <div class="text-center">
        <button type="button" class="btn btn-primary m-2" onclick="addPlayer()">+</button>
      </div>

      <footer class="fixed-bottom footerstyle">
        <div class="container-fluid h-100 py-2 text-center">
          v0.2
        </div>
      </footer>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"></script>

    <script src="./resources/js/main.js"></script>
  </body>
</html>
